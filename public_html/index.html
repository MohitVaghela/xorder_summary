<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Summary</title>
  <link rel="icon" type="image/png" href="src/assets/favicon-32x32.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="src/css/style.css" />
</head>
<body>
  <div class="main d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
      <img src="src/assets/illustration-hero.svg" alt="Hero Illustration" class="hero-img" />
      <div class="content-box">
        <h1 class="heading">Order Summary</h1>
        <p class="summary-para">
          You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!
        </p>
        <div class="plan-box d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-3">
            <img src="src/assets/icon-music.svg" alt="Music Icon" />
            <div class="plan-text">
              <h3 class="plan-name">Annual Plan</h3>
              <p class="plan-price">$59.99/year</p>
            </div>
          </div>
          <div class="change-link">
            <a href="#">Change</a>
          </div>
        </div>
        <button class="proceed-btn w-100">Proceed to Payment</button>
        <div class="text-center mt-1">
          <a href="#" class="cancel-order">Cancel Order</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
